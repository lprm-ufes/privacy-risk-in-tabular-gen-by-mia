[io]
member_dataset_input = 'datasets/dataset_name/real/dataset_name_train.csv'
non_member_dataset_input = 'datasets/dataset_name/reference/dataset_name_reference.csv'
test_dataset_input = 'datasets/dataset_name/real/dataset_name_test.csv'
dataset_info = 'datasets/dataset_name/info.toml'

synthetic_tracker_file = 'results/CTGAN/dataset_name/ablation/synthetic/synthetic_tracker.csv'
synthetic_datasets_folder = 'results/CTGAN/dataset_name/ablation/synthetic/datasets'
results_output_folder = 'results/CTGAN/dataset_name/ablation/results'

[exp]
start_exp = 1
save_scores = true
plot = false
remove_exps_folder = true

run_attack = true
run_utility = false
run_fidelity = false

[flowmia_params]
seed = 42
test_size = 200 # If not defined the value is min(total_test_size, total_reference_size)
use_wgan = true
batch_size = 50
num_epochs = 30
fcheckpoint = 100
domias_epochs = 30
domias_batch_size = 50

[utility_params]
rf_n_estimators = 100
knn_n_neighbors = 5
mlp_hidden_layer_sizes = [60]
mlp_max_iter = 300
mlp_batch_size = 50