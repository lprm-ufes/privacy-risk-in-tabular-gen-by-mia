[io]
real_dataset_input = 'datasets/dataset_name/real/dataset_name_train.csv'
dataset_info = 'datasets/dataset_name/info.toml'

tracker_file_output_folder = 'results/config_schemas/dataset_name/ablation/synthetic'
results_output_model_folder = 'results/config_schemas/dataset_name/ablation/synthetic/models'
results_output_synthetic_folder = 'results/config_schemas/dataset_name/ablation/synthetic/datasets'

[exp]
start_exp = 1

# true, false
save_models = false

model = 'model_name'

[exp_params]
seeds = [42, 0, 1234]

[model_hyperparameters]
# Every param must be a list
example_batch_size = [32]