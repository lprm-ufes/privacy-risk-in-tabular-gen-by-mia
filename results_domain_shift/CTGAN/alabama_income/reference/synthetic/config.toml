[io]
real_dataset_input = 'datasets/alabama_income/real/alabama_income_train.csv'
dataset_info = 'datasets/alabama_income/info.toml'

tracker_file_output_folder = 'results_domain_shift/CTGAN/alabama_income/reference/synthetic'
results_output_model_folder = 'results_domain_shift/CTGAN/alabama_income/reference/synthetic/models'
results_output_synthetic_folder = 'results_domain_shift/CTGAN/alabama_income/reference/synthetic/datasets'

[exp]
start_exp = 1

# true, false
save_models = false

model = 'ctgan'

[exp_params]
seeds = [0, 42, 1234]

[model_hyperparameters]
n_iter = [1000]
lr = [1e-3]
weight_decay = [1e-3]
batch_size = [64]
generator_n_layers_hidden = [2]
generator_n_units_hidden = [500]

# ["relu", "leaky_relu", "tanh", "elu"]
generator_nonlin = ['relu']

discriminator_n_layers_hidden = [2]
discriminator_n_units_hidden = [500]

# ["relu", "leaky_relu", "tanh", "elu"]
discriminator_nonlin=['leaky_relu']