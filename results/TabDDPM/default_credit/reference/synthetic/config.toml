[io]
real_dataset_input = 'datasets/default_credit/real/default_credit_train.csv'
dataset_info = 'datasets/default_credit/info.toml'

tracker_file_output_folder = 'results/TabDDPM/default_credit/reference/synthetic'
results_output_model_folder = 'results/TabDDPM/default_credit/reference/synthetic/models'
results_output_synthetic_folder = 'results/TabDDPM/default_credit/reference/synthetic/datasets'

[exp]
start_exp = 4

# true, false
save_models = false

model = 'ddpm'

[exp_params]
seeds = [42, 0, 1234]

[model_hyperparameters]
n_iter = [1000]
lr = [1e-4]
weight_decay = [1e-4]
batch_size = [64]
num_timesteps = [1000]
dim_embed = [128]